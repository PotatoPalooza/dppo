# Generated from rl_mimicgen.adapters.dppo_lowdim.
# On another machine, rerun `scripts/run_official_dppo_mimicgen.py prepare --task ...`
# to rewrite machine-local absolute paths such as `robomimic_env_cfg_path`.
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.eval.eval_diffusion_agent.EvalDiffusionAgent

name: coffee_d0_eval_bc_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: /home/nelly/projects/rl-mimicgen/logs/official_dppo/mimicgen/eval/coffee_d0/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: /home/nelly/projects/rl-mimicgen/runs/official_dppo_mimicgen/data/coffee_d0/override_base_policy_path.pt
robomimic_env_cfg_path: /home/nelly/projects/rl-mimicgen/runs/official_dppo_mimicgen/data/coffee_d0/env_meta.json
normalization_path: /home/nelly/projects/rl-mimicgen/runs/official_dppo_mimicgen/data/coffee_d0/normalization.npz

seed: 42
device: cuda:0
env_name: coffee_d0
obs_dim: 116
action_dim: 7
denoising_steps: 20
cond_steps: 1
horizon_steps: 4
act_steps: 4
ft_denoising_steps: 0

n_episodes: 20
n_steps: 400
render_num: 0

env:
  n_envs: 50
  name: ${env_name}
  success_info_key: success
  best_reward_threshold_for_success: 1
  max_episode_steps: 400
  save_video: False
  specific:
    robomimic_hard_reset: True
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: ["object", "robot0_eef_pos", "robot0_eef_pos_rel_pod", "robot0_eef_pos_rel_pod_holder", "robot0_eef_quat", "robot0_eef_quat_rel_pod", "robot0_eef_quat_rel_pod_holder", "robot0_eef_vel_ang", "robot0_eef_vel_lin", "robot0_gripper_qpos", "robot0_gripper_qvel", "robot0_joint_pos", "robot0_joint_pos_cos", "robot0_joint_pos_sin", "robot0_joint_vel"]
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True


model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: ${ft_denoising_steps}
  predict_epsilon: True
  denoised_clip_value: 1.0
  randn_clip_value: 3
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 32
    mlp_dims: [1024, 1024, 1024]
    cond_mlp_dims: [512, 64]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
